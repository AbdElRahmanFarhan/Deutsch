# What happens when you skip, and how the streak counts.

# A day counts toward the streak if you did at least this:
streak_counts = "either"          # "focus_session", "refresher" or "either"

# Missed focus sessions:
#   "weekend"  - their content is added to the next Saturday/Sunday session
#   "shrink"   - no make-up; the next session is a shorter comeback and the plan slides
#   "skip"     - dropped; the end date stays fixed
missed_mode = "weekend"
weekend_makeup_cap_minutes = 60   # per weekend day; anything beyond slides the end date

# After this many missed sessions in a row, the next one starts as a comeback:
# shorter, mostly review.
comeback_after_missed = 3
comeback_minutes = 30

# If fewer than this many focus sessions happened in the past 7 days,
# the projected end date moves later and the dashboard shows it.
min_sessions_per_7_days = 5

# How missed days are mentioned: "brief" (one line, no lecture) or "off".
missed_day_message = "brief"
