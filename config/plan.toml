# Course plan: goal, phases and pace. The Lektion-by-Lektion syllabus is in
# curriculum/syllabus.md.

[goal]
level = "A2"
exam = "goethe"        # "goethe", "telc", "dtz" or "" if undecided
exam_date = ""         # "YYYY-MM-DD" once booked
target_date = "2027-02-28"
target_words = 1300    # roughly the size of the Goethe A2 word list

# Planned phase dates. The dashboard projects the real finish date from your
# actual progress; these are the plan it compares against.
[phases]
a1_review = { start = "2026-11-24", end = "2026-12-13", source = "Menschen A1.1 + A1.2" }
a2        = { start = "2026-12-14", end = "2027-01-24", source = "Menschen A2.1 + A2.2" }
exam_prep = { start = "2027-01-25", end = "2027-02-07", source = "Goethe A2 model tests" }

[pace]
a1_hours_per_lektion = 1.75   # A1 is mostly forgotten, so every Lektion is done properly
a2_hours_per_lektion = 3.5
exam_prep_hours = 28
new_words_per_hour = 15

# Minutes per part of a 1-hour session. Longer sessions scale these up.
[session_parts]
review = 10
grammar = 15
vocabulary = 10
book_exercises = 15
speaking_or_writing = 10
