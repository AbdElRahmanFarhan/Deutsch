# Refreshers: short REVIEW of what you've already met — your mistakes and past material.
# Nothing new is taught here; for that, use a Quick lesson (quick.toml).
# You can always start one yourself, whatever these settings say.

enabled = true

# A refresher has two parts: fast flashcards of words due for review (tap to reveal,
# rate yourself), then a few typed questions on your mistakes and past lessons.
minutes = 10
cards = 40          # most flashcards per refresher
questions = 5       # typed questions after the cards

# Scheduled refreshers per day. Their times are picked at random inside the window,
# at least min_gap_minutes apart, and never inside a focus session.
per_day = 3
window_start = "08:00"
window_end = "21:00"
min_gap_minutes = 90

# Days refreshers run on: any of mon tue wed thu fri sat sun.
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]

# Typed questions adapt to your accuracy: above the target they get harder
# (whole sentences), well below it they get easier (single words).
target_accuracy = 0.85

# How many typed questions aim at your most common mistake type (articles, cases, ...).
weak_spot_questions = 2

# Questions asked in the last this-many days are never repeated word for word.
no_repeat_days = 3

# What the typed questions draw from, as relative weights.
[mix]
recent_mistakes = 5    # your mistakes, re-asked as new questions on the same point
due_reviews = 3        # grammar items and words due in spaced repetition
past_lessons = 2       # exercises from lessons you've finished, reworded
