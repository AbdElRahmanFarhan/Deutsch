# Short refresher exercises spread through the day, separate from the focus sessions.
# You can always start one yourself (on the bus, in a queue), whatever these settings say.

enabled = true

# A refresher has two parts: fast flashcards (tap to reveal, rate yourself),
# then a few typed questions aimed at your weak spots.
minutes = 10
cards = 40          # most flashcards per refresher
questions = 5       # typed questions after the cards

# Scheduled refreshers per day. Their times are picked at random inside the window,
# at least min_gap_minutes apart, and never inside a focus session.
per_day = 3
window_start = "08:00"
window_end = "21:00"
min_gap_minutes = 90

# Days refreshers run on: any of mon tue wed thu fri sat sun.
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]

# Typed questions adapt to your accuracy: above the target they get harder
# (whole sentences), well below it they get easier (single words).
target_accuracy = 0.85

# How many typed questions aim at your most common mistake type (articles, cases, ...).
weak_spot_questions = 2

# What the typed questions draw from, as relative weights.
[mix]
due_reviews = 3        # grammar items and words due in spaced repetition
recent_mistakes = 5    # entries from the mistakes log
current_lektion = 2    # material from the Lektion you're on now
older_material = 1     # random items from earlier Lektionen, even if not due

# Question styles the typed questions may use.
[styles]
translate_to_german = true
translate_to_english = true
fill_the_gap = true
article_and_plural = true
build_a_sentence = true
