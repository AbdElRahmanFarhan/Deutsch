# Spaced repetition (SM-2) for words, grammar and mistakes.

# Daily limits. Most overdue cards come first.
max_reviews_per_day = 150
max_new_items_per_day = 20
# When more than this many cards are due, no new words are shown until you catch up.
pause_new_when_due_over = 100

# Flashcards work any time: when few or no cards are due, the rest are practice cards from
# words you already know, weakest first. Practising doesn't push a word further away;
# only forgetting changes its schedule (it comes back tomorrow).
extra_practice = true

# Each word is learned in two stages:
#   recognize: see the German, recall the English
#   produce:   see the English, recall the German with article and plural
# The produce stage opens once a word has been recognized correctly this many times.
produce_after_correct = 2

# SM-2 parameters
starting_ease = 2.5
minimum_ease = 1.3
first_interval_days = 1
second_interval_days = 6

# A card failed this many times is a "hard word": it gets a memory hook,
# a fresh example sentence, and is never scheduled more than max_hard_interval_days away.
leech_after_failures = 4
max_hard_interval_days = 4
