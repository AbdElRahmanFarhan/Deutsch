# Weekly focus sessions. This is the only place the timetable lives.
# Times are German time (Europe/Berlin), 24-hour "HH:MM".
# Leave start = "" until you pick a time; reminders skip sessions with no start time.

timezone = "Europe/Berlin"
start_date = "2026-11-24"

# kind:
#   "split"    - one half of a Lektion (first day: grammar + vocab, second day: exercises + writing)
#   "full"     - one whole Lektion in one sitting
#   "practice" - mixed practice, exam-style task, speaking
#   "weekly"   - Modul review, long speaking session, mini-test, weekly check-in

[[session]]
day = "mon"
start = ""
minutes = 60
kind = "split"

[[session]]
day = "tue"
start = ""
minutes = 60
kind = "split"

[[session]]
