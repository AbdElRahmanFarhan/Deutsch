<style>
/* Layout: a control desk. Top bar, then the view. Home = today strip, launchers, progress board.
   Lesson = step rail on the left (chips on phones) + one step at a time. */
:root {
  --bg: #eef0ec; --surface: #fbfcfa; --sunk: #e4e7e1; --ink: #17212b; --muted: #59646f; --line: #d3d8d0;
  --accent: #1f4e8c; --accent-ink: #ffffff; --signal: #f2c230; --signal-ink: #17212b;
  --good: #2c7a4b; --warn: #a86a12; --bad: #b3412e; --good-bg: #dcefe2; --bad-bg: #f6e0db; --warn-bg: #f6ead2;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1319; --surface: #161e27; --sunk: #1d2732; --ink: #e6ebf0; --muted: #94a1ae; --line: #2a3542;
  --accent: #8db4f0; --accent-ink: #0e1319; --signal: #f2c230; --signal-ink: #17212b;
  --good: #63c38f; --warn: #e2ab52; --bad: #ea8571; --good-bg: #183327; --bad-bg: #3a1f1a; --warn-bg: #3a2d15;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #161e27; --sunk: #1d2732; --ink: #e6ebf0; --muted: #94a1ae; --line: #2a3542;
  --accent: #8db4f0; --accent-ink: #0e1319; --signal: #f2c230; --signal-ink: #17212b;
  --good: #63c38f; --warn: #e2ab52; --bad: #ea8571; --good-bg: #183327; --bad-bg: #3a1f1a; --warn-bg: #3a2d15;
  color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--display); font-size: 1.2rem; }
.plate { display: inline-block; background: var(--signal); color: var(--signal-ink); font-family: var(--mono); font-weight: 500; font-size: .78rem; padding: 2px 7px; border-radius: 4px; border: 1px solid #00000022; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; font-weight: 600; font-size: .92rem; }
.nav a[aria-current="page"] { color: var(--ink); background: var(--sunk); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.go { background: var(--signal); color: var(--signal-ink); border-color: #0000001f; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 10px; font-size: .86rem; }
.btn[disabled] { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 14px; }

/* banners */
.banner { border: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 10px 14px; border-radius: 8px; }
.banner.bad { border-left-color: var(--bad); background: var(--bad-bg); }
.banner.good { border-left-color: var(--good); background: var(--good-bg); }

/* home */
.today { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.hero-lesson h1 { margin: 6px 0 4px; }
.hero-lesson .meta { color: var(--muted); }
.sessions { display: grid; gap: 8px; margin-top: 10px; }
.sess { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 8px; background: var(--sunk); }
.chip { display: inline-block; font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.Done, .chip.done { background: var(--good-bg); color: var(--good); }
.chip.Missed, .chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.Planned, .chip.warn { background: var(--warn-bg); color: var(--warn); }
.launch { margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { text-align: left; display: grid; gap: 4px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; min-height: 108px; }
.tile:hover { border-color: var(--accent); }
.tile .k { font-family: var(--display); font-weight: 700; font-size: 1.1rem; }
.tile .d { color: var(--muted); font-size: .9rem; }
.tile .n { font-family: var(--mono); font-size: .8rem; color: var(--accent); margin-top: auto; }
.board { margin-top: 26px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat .v { font-family: var(--display); font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .s { color: var(--muted); font-size: .88rem; }
.wide { grid-column: span 2; }
.full { grid-column: 1 / -1; }
.strip { display: grid; gap: 10px; }
.vol { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; }
.cells { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.cell { aspect-ratio: 1.4; max-width: 100%; border-radius: 4px; border: 1px solid var(--line); background: var(--sunk); cursor: pointer; padding: 0; font-family: var(--mono); font-size: .66rem; color: var(--muted); }
.cell.half { background: linear-gradient(135deg, var(--accent) 50%, var(--sunk) 50%); color: var(--accent-ink); }
.cell.done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cell.cur { outline: 2px solid var(--signal); outline-offset: 1px; }
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 120px; }
.bar { display: grid; align-content: end; gap: 4px; height: 100%; text-align: center; }
.bar i { display: block; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.bar.today i { background: var(--signal); }
.bar span { font-size: .7rem; color: var(--muted); font-family: var(--mono); }
.hbar { display: grid; grid-template-columns: 110px minmax(0, 1fr) 28px; gap: 8px; align-items: center; font-size: .9rem; }
.hbar .t { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.hbar .t i { display: block; height: 100%; background: var(--bad); }
table.sc { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.sc th, table.sc td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.sc td.num, table.sc th.num { text-align: right; font-family: var(--mono); }
.sbox { display: inline-grid; place-items: center; width: 24px; height: 22px; border-radius: 4px; font-family: var(--mono); font-size: .8rem; background: var(--sunk); }
.sbox.s1, .sbox.s2 { background: var(--bad-bg); color: var(--bad); }
.sbox.s3 { background: var(--warn-bg); color: var(--warn); }
.sbox.s4, .sbox.s5 { background: var(--good-bg); color: var(--good); }
.scroll-x { overflow-x: auto; }

/* lessons index */
.lx { display: grid; gap: 6px; margin-top: 16px; }
.lx-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.lx-row .parts { display: flex; gap: 6px; flex-wrap: wrap; }

/* lesson player */
.lesson-head { margin-top: 20px; display: grid; gap: 6px; }
.player { margin-top: 18px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); display: grid; gap: 2px; }
.rail button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; align-items: center; color: var(--muted); font-weight: 600; }
.rail button[aria-current="step"] { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 0 var(--signal); }
.rail .tick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-grid; place-items: center; font-size: .7rem; flex: none; }
.rail .tick.on { background: var(--good); border-color: var(--good); color: var(--surface); }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; min-width: 0; display: grid; gap: 16px; }
.prose { font-family: var(--read); font-size: 1.04rem; line-height: 1.6; max-width: 68ch; }
.prose h3 { font-family: var(--display); margin-top: 8px; }
.prose table { border-collapse: collapse; font-family: var(--body); font-size: .95rem; }
.prose th, .prose td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
.prose code { font-family: var(--mono); font-size: .88em; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.prose details { background: var(--sunk); border-radius: 8px; padding: 8px 12px; }
.prose summary { cursor: pointer; font-family: var(--body); font-weight: 600; }
.tablewrap { overflow-x: auto; max-width: 100%; }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.word { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; background: var(--bg); }
.word .de { font-family: var(--display); font-weight: 700; font-size: 1.08rem; }
.word .de .art-der { color: #2f6fd0; } .word .de .art-die { color: #c0392b; } .word .de .art-das { color: #2c8a4b; }
.word .ex { font-family: var(--read); font-size: .93rem; }
.hide-en .word .en, .hide-en .word .exen { filter: blur(5px); }
.speak-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; width: 30px; height: 28px; cursor: pointer; display: inline-grid; place-items: center; flex: none; font-size: 15px; }
.speak-btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bad-text { color: var(--bad); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: min(560px, calc(100vw - 32px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: .92rem; box-shadow: 0 4px 16px #0004; }
.bk-task { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.bk-task.done { border-color: var(--good); }
.bk-task .score input { width: 56px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 8px; }
.bk-task textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: .9rem; }
.q { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.q .qt { font-family: var(--read); }
.q input, .q textarea, textarea.big, input.big { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 10px; }
textarea.big { min-height: 160px; font-family: var(--read); font-size: 1.02rem; line-height: 1.55; }
.q.right { border-color: var(--good); background: var(--good-bg); }
.q.wrong { border-color: var(--bad); background: var(--bad-bg); }
.fb { font-size: .92rem; }
.audio { display: grid; gap: 10px; padding: 14px; border-radius: 8px; background: var(--sunk); }
.audio audio { width: 100%; }
.tracks { display: grid; gap: 4px; }
.track { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.track:hover, .track.on { background: var(--surface); }
.track .tm { font-family: var(--mono); color: var(--accent); }
.chat { display: grid; gap: 10px; max-height: 460px; overflow-y: auto; padding: 4px; }
.msg { max-width: 82%; padding: 9px 12px; border-radius: 10px; font-family: var(--read); }
.msg.p { background: var(--sunk); justify-self: start; }
.msg.me { background: var(--accent); color: var(--accent-ink); justify-self: end; }
.msg.sys { background: transparent; color: var(--muted); font-family: var(--body); font-size: .88rem; justify-self: center; }
.compose { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: end; }
.compose textarea { min-height: 52px; resize: vertical; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; width: 100%; }
.mic.on { background: var(--bad); color: #fff; border-color: var(--bad); }
.card { display: grid; place-items: center; text-align: center; gap: 10px; min-height: 230px; padding: 24px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.card .front { font-family: var(--display); font-size: 2rem; font-weight: 700; }
.card .back { font-family: var(--read); font-size: 1.1rem; }
.progress { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.scores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.scores div { text-align: center; padding: 10px; border-radius: 8px; background: var(--sunk); }
.scores b { display: block; font-family: var(--display); font-size: 1.6rem; }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 10px; }

@media (max-width: 860px) {
  .today { grid-template-columns: minmax(0, 1fr); }
  .launch { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .player { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .rail button { white-space: nowrap; }
  .rail button[aria-current="step"] { box-shadow: inset 0 -3px 0 var(--signal); }
}
@media (max-width: 480px) {
  .launch { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: minmax(0, 1fr); }
  .wide { grid-column: auto; }
  .cells { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .scores { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lx-row { grid-template-columns: minmax(0, 1fr); }
  .step { padding: 16px; }
  .compose { grid-template-columns: minmax(0, 1fr) auto; }
}
</style>

/* =====================================================================
   Markdown (Notion-flavoured subset) → HTML
   ===================================================================== */
function inline(s) {
  let t = esc(s);
  t = t.replace(/&lt;(\/?)(b|i|u|s|em|strong|code)&gt;/g, "<$1$2>").replace(/&lt;br\s*\/?&gt;/g, "<br>");
  t = t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t.replace(/\\([_*\[\]()#>~`|-])/g, "$1");
}
function md(src) {
  const lines = String(src || "").split("\n"); let out = ""; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^<toggle>/.test(l.trim())) {
      const sum = lines[i + 1] || ""; let j = i + 2; const inner = [];
      while (j < lines.length && !/^<\/toggle>/.test(lines[j].trim())) inner.push(lines[j++]);
      out += `<details><summary>${inline(sum)}</summary>${md(inner.join("\n"))}</details>`; i = j + 1; continue;
    }
    const hm = l.match(/^(#{1,4})\s+(.*)/);
    if (hm) { out += `<h3>${inline(hm[2])}</h3>`; i++; continue; }
    if (/^\|/.test(l.trim())) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i].trim())) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\|\s*-{2,}/.test(r.trim()));
      out += `<div class="tablewrap"><table>${body.map((r, k) => `<tr>${cells(r).map(c => k === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
      continue;
    }
    if (/^\s*[-*]\s+/.test(l)) {
      const items = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/, ""));
      out += `<ul>${items.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`; continue;
    }
    if (/^\s*\d+\.\s+/.test(l)) {
      const items = []; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*\d+\.\s+/, ""));
      out += `<ol>${items.map(x => `<li>${inline(x)}</li>`).join("")}</ol>`; continue;
    }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(\||#|\s*[-*]\s|\s*\d+\.\s|<toggle>)/.test(lines[i])) para.push(lines[i++]);
    if (!para.length) { i++; continue; }
    out += `<p>${inline(para.join(" "))}</p>`;
  }
  return out;
}
const plain = s => unesc(String(s || "").replace(/<[^>]+>/g, "")).trim();

/* ---------- lesson parsing ---------- */
function sections(content) {
  const out = []; let cur = { title: "", body: [] };
  for (const line of content.split("\n")) {
    const m = line.match(/^## (.+)/);
    if (m) { out.push(cur); cur = { title: m[1].trim(), body: [] }; } else cur.body.push(line);
  }
  out.push(cur);
  return out.filter(s => s.title).map(s => ({ title: s.title, body: s.body.join("\n").trim() }));
}
function toggles(body) {
  const list = [];
  const main = body.replace(/<toggle>[ \t]*\n([^\n]*)\n([\s\S]*?)<\/toggle>/g, (_, sum, inner) => { list.push({ summary: sum.trim(), body: inner.trim() }); return ""; });
  return { main: main.trim(), list };
}
const numbered = text => text.split("\n").map(l => l.match(/^\s*(\d+)\.\s+(.*)$/)).filter(Boolean).map(m => ({ n: +m[1], text: m[2] }));
function parseAnswer(a) {
  const m = a.match(/^(.*?)\s*\(also accepted:\s*(.*)\)\s*$/i);
  const main = plain(m ? m[1] : a);
  const alts = m ? m[2].split(/;|\s\/\s/).map(plain).filter(Boolean) : [];
  return { main, all: [main, ...alts] };
}
function qaBlock(body) {
  const { main, list } = toggles(body);
  const ansT = list.find(t => /answer/i.test(t.summary));
  const answers = ansT ? numbered(ansT.body) : [];
  const qs = numbered(main);
  const intro = main.split("\n").filter(l => !/^\s*\d+\.\s/.test(l)).join("\n").trim();
  return { intro, items: qs.map(q => ({ n: q.n, q: q.text, a: (answers.find(a => a.n === q.n) || {}).text || "" })) };
}
function parseWords(body) {
  const rows = body.split("\n").filter(l => /^\|/.test(l.trim()) && !/^\|\s*-{2,}/.test(l.trim()));
  const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => plain(c));
  return rows.slice(1).map(cells).map(([de, plural, en, ex]) => {
    let exen = ""; let exde = ex || "";
    const m = exde.match(/^(.*?)\s*\(([^()]*)\)\s*$/); if (m) { exde = m[1]; exen = m[2]; }
    const art = (de.match(/^(der|die|das)\s/) || [])[1] || "";
    return { de, plural: plural === "–" || plural === "-" ? "" : plural, en, ex: exde, exen, art };
  }).filter(w => w.de);
}
function parseListening(body) {
  const { main, list } = toggles(body);
  const file = (main.match(/L(\d+)-(KB|AB)\.mp3/) || []);
  const tracks = [];
  for (const l of main.split("\n")) { const m = l.match(/^\s*[-*]\s+(\d+):(\d\d)\s+(.*)$/); if (m) { const [label, ...rest] = m[3].split(/:\s/); tracks.push({ t: +m[1] * 60 + +m[2], label: plain(label), desc: plain(rest.join(": ")) }); } }
  const qa = qaBlock(main.split("\n").filter(l => !/^\s*[-*]\s+\d+:\d\d/.test(l) && !/^Audio:/.test(l)).join("\n") + (list.length ? "\n<toggle>\n" + list[0].summary + "\n" + list[0].body + "\n</toggle>" : ""));
  return { idx: file[1] != null ? +file[1] : null, kind: file[2] || "KB", tracks, ...qa };
}
function parseSpeaking(body, words) {
  const { main, list } = toggles(body);
  const model = (list.find(t => /model/i.test(t.summary)) || {}).body || "";
  const grab = name => { const m = main.match(new RegExp(`<b>${name}:</b>\\s*([^\\n]*)`, "i")); return m ? plain(m[1]) : ""; };
  let task = grab("Task"), prompts = grab("Partner prompts").split("·").map(s => s.trim()).filter(Boolean), must = grab("Must use").split(",").map(s => s.trim()).filter(Boolean);
  if (!task) {
    task = plain(main.split("\n").filter(l => !/^\s*[-*]\s/.test(l) && !/should ask/i.test(l)).join(" "));
    prompts = main.split("\n").filter(l => /^\s*[-*]\s/.test(l)).map(l => plain(l.replace(/^\s*[-*]\s+/, "")));
    must = words.slice(0, 8).map(w => w.de);
  }
  return { task, prompts, must, model: plain(model) };
}
function parseLesson(content) {
  const sec = sections(content); const get = re => sec.find(s => re.test(s.title));
  const words = get(/^Words/) ? parseWords(get(/^Words/).body) : [];
  return {
    goal: get(/^Goal/)?.body || "", grammar: get(/^Grammar/)?.body || "", recap: get(/^Recap/)?.body || "",
    words, book: get(/^Book work/)?.body || "", workbook: get(/^Workbook/)?.body || "",
    listening: get(/^Listening/) ? parseListening(get(/^Listening/).body) : null,
    exercises: get(/^Exercises/) ? qaBlock(get(/^Exercises/).body) : { intro: "", items: [] },
    writing: get(/^Writing/)?.body || "",
    speaking: get(/^Speaking/) ? parseSpeaking(get(/^Speaking/).body, words) : null,

}

/* ---------- answer checking ---------- */
const norm = s => plain(s).toLowerCase().replace(/ß/g, "ss").replace(/[.,!?;:"'„“”‚‘’()]/g, "").replace(/\s+/g, " ").trim();
async function grade(items, context) {
  // items: [{id, q, expected:[...], answer}] → {id: {correct, feedback, correct_form, category, reason}}
  const res = {}; const unsure = [];
  for (const it of items) {
    if (!it.answer || !it.answer.trim()) { res[it.id] = { correct: false, empty: true, feedback: "No answer.", correct_form: it.expected[0] || "" }; continue; }
    if (it.expected.some(e => e && norm(e) === norm(it.answer))) res[it.id] = { correct: true, feedback: "" };
    else unsure.push(it);
  }
  if (unsure.length) {
    const prompt = `${LEARNER}
You are checking answers ${context || "to German exercises"}. For each item decide if the learner's answer is correct. Accept answers that are grammatically correct German and fit the task even if they differ from the expected answer. Ignore capitalisation and punctuation. For comprehension questions answered in English, accept any answer with the same meaning.
For wrong answers give: the correct form, a one-line reason in English, and a category from: article, case, word order, verb form, grammar, vocabulary, spelling, pronunciation.
Reply with only JSON: {"results":[{"id":"...","correct":true|false,"correct_form":"...","reason":"...","category":"...","feedback":"one short line, English"}]}

Items:
${JSON.stringify(unsure.map(u => ({ id: u.id, task: u.q, expected: u.expected, learner_answer: u.answer })), null, 1)}`;
    const out = await ask(prompt, "quick");
    for (const r of (out && out.results) || []) res[r.id] = r;
  }
  return res;
}

/* ---------- reusable: a set of questions with inputs + check ---------- */
function questionSet({ items, store, ctx, onGraded, multiline }) {
  // items: [{id, q, expected:[..]}]; store: object persisted by caller
  store.answers = store.answers || {}; store.results = store.results || {};
  const wrap = h("div", { class: "stack" });

  for (const it of items) {
    const input = multiline ? h("textarea", { id: "a-" + it.id, rows: 2 }) : h("input", { id: "a-" + it.id, type: "text", autocomplete: "off", spellcheck: "false", lang: "de" });
    input.value = store.answers[it.id] || "";
    input.addEventListener("input", () => { store.answers[it.id] = input.value; store.save && store.save(); });
    const fb = h("div", { class: "fb" });
    const box = h("div", { class: "q" }, h("div", { class: "qt", html: `<b>${esc(String(it.n ?? ""))}.</b> ${inline(it.q)}` }), input, fb);
    els[it.id] = { box, fb, input };
    wrap.append(box);
  }
  const paint = () => {
    for (const it of items) {
      const r = store.results[it.id]; const e = els[it.id];
      e.box.classList.toggle("right", !!(r && r.correct)); e.box.classList.toggle("wrong", !!(r && !r.correct));
      e.fb.replaceChildren(); if (!r) continue;
      if (r.correct) e.fb.append(h("span", { style: "color:var(--good);font-weight:600" }, "Right. "), r.feedback || "");
      else e.fb.append(h("span", { style: "color:var(--bad);font-weight:600" }, "Not quite. "), r.correct_form ? h("span", null, "Better: ", h("b", { lang: "de" }, r.correct_form), ". ") : null, r.reason || r.feedback || "");
    }
  };
  paint();
  const status = h("span", { class: "small muted" });
  const btn = h("button", { class: "btn primary", onclick: async () => {
    btn.disabled = true; status.replaceChildren(spinner("Checking…"));
    try {
      const res = await grade(items.map(it => ({ id: it.id, q: it.q, expected: it.expected, answer: store.answers[it.id] || "" })), ctx);
      store.results = res; store.save && store.save(); paint();
      const right = items.filter(it => res[it.id] && res[it.id].correct).length;
      status.textContent = `${right} of ${items.length} right.`;
      onGraded && onGraded(items.map(it => ({ it, r: res[it.id], answer: store.answers[it.id] || "" })), right);
    } catch (e) { status.textContent = sampleErr(e); }
    btn.disabled = false;
  } }, "Check my answers");
  const score = () => items.filter(it => store.results[it.id] && store.results[it.id].correct).length;
  if (Object.keys(store.results).length) status.textContent = `${score()} of ${items.length} right.`;
  return { el: h("div", { class: "stack" }, wrap, h("div", { class: "row" }, btn, status)), score };
}

function renderLesson(root, key, row, page, restored) {
  const L = parseLesson(page.content);
  const lek = lektionOfKey(key) || {};
  const part = +key.slice(-1);
  const lektionUrl = lek.url || rel(row.Lektion)[0];
  const st = ls.get("prog:" + key, { done: {}, ex: {}, li: {}, rd: {}, wr: {}, started: Date.now() });
  let opened = false;
  st.save = now => { st.savedAt = Date.now(); const { save, ...rest } = st; ls.set("prog:" + key, rest); cloudSave("lesson-" + key, rest, now === true); };
  st.ex.save = st.li.save = st.rd.save = st.save;
  st.mistakes = st.mistakes || [];
  const level = levelOf(lek.Index || 0);

  const steps = [];
  if (part === 1) steps.push({ id: "learn", name: "Goal & grammar" }); else steps.push({ id: "learn", name: "Recap" });
  if (L.words.length) steps.push({ id: "words", name: "Words" });
  steps.push({ id: "reading", name: "Reading" });
  if (L.listening) steps.push({ id: "listening", name: "Listening" });
  if (L.workbook || L.book) steps.push({ id: "book", name: "Workbook" });

   ===================================================================== */
function leitner(w, stage, right) {
  const iv = intervals(), t = today();
  const openAt = setn("Open produce stage at box", 3), hardAfter = setn("Hard word after lapses", 4);
  const p = {}; let box = stage === "produce" ? (w["Produce box"] || 1) : (w.Box || 1); let lapses = w.Lapses || 0;

  else { box = 1; lapses++; p.Lapses = lapses; if (lapses >= hardAfter) p.Hard = "__YES__"; }
  if (stage === "produce") { p["Produce box"] = box; Object.assign(p, dateProp("Produce next", addDays(t, right ? iv[box - 1] : 1))); }
  else {
    p.Box = box; Object.assign(p, dateProp("Next review", addDays(t, right ? iv[box - 1] : 1)));
    if (box >= openAt && !(w["Produce box"] > 0)) { p["Produce box"] = 1; Object.assign(p, dateProp("Produce next", addDays(t, 1))); }
  }
  const rb = p.Box ?? w.Box ?? 0, pb = p["Produce box"] ?? w["Produce box"] ?? 0;
  p.Status = rb >= 4 && pb >= 3 ? "Known" : "Learning";
  return p;
}
function cardDeck(due, practice, n) {
  const t = today();
  const deck = [];
  for (const w of due) {
    const pDue = w["Produce box"] > 0 && (w["date:Produce next:start"] || "9") <= t;
    const rDue = (w["date:Next review:start"] || "9") <= t;
    if (rDue) deck.push({ w, stage: "recognise", practice: false });
    else if (pDue) deck.push({ w, stage: "produce", practice: false });
  }
  deck.sort((a, b) => (b.w.Hard === "__YES__") - (a.w.Hard === "__YES__"));
  const seen = new Set(deck.map(c => c.w.url));
  if (setv("Practice cards") !== "off") for (const w of practice) { if (deck.length >= n) break; if (!seen.has(w.url) && (w.Box || 0) > 0) { deck.push({ w, stage: (w["Produce box"] || 0) > 0 && Math.random() < 0.5 ? "produce" : "recognise", practice: true }); seen.add(w.url); } }
  return deck.slice(0, n);
}

    const done = () => resolve({ cards: i, reviews, right, updates });
    if (!deck.length) { host.replaceChildren(h("div", { class: "empty" }, "No cards to review right now.")); return done(); }
    const draw = () => {

    host.replaceChildren(h("span", { class: "label" }, "Weekly revision · writing"), h("div", { class: "prose" }, h("p", null, task)), ta, h("div", { class: "row" }, btn, skip), fb);
  });
}

/* =====================================================================
   QUICK LESSON
   ===================================================================== */
function showQuick() {
  const root = h("div"); view.append(root);
  const host = h("div", { class: "step", style: "margin-top:16px" });
  const typeSel = h("select", { id: "quick-type" }, h("option", { value: "" }, "Next in rotation"), ["words", "phrases", "reading", "grammar"].map(t => h("option", { value: t }, t)));
  root.append(h("div", { class: "lesson-head" }, h("h1", null, "Quick lesson"), h("p", { class: "muted" }, "10-15 minutes of something new for the bus. It doesn't move the book forward; new words become flashcards from tomorrow.")), host);
  host.append(h("div", { class: "row" }, typeSel, h("button", { class: "btn go", onclick: () => run() }, "Start")));

  const store = sessionStore("quick", 6);
  const startRow = host.firstChild;
  store.load().then(saved => {
    if (!saved || !saved.lesson || !host.isConnected || host.firstChild !== startRow) return;
    const n = (saved.lesson.exercises || []).length;
    const where = saved.phase === "teach" ? "the words" : saved.phase === "questions" ? `exercise ${Math.min((saved.q.i || 0) + 1, n)} of ${n}` : "saving to Notion";
    resumeBox(host, saved, `“${saved.lesson.title || saved.type}”, at ${where}.`, () => continueRun(saved), () => { store.clear(); host.replaceChildren(startRow); });
  });

  async function run() {
    const t0 = Date.now();
    store.clear();
    host.replaceChildren(spinner("Choosing today's topic…"));
    let lesson, type, cands;
    try {
      await loadCore();
      const [counts, startedRows, G] = await Promise.all([todayCounts(), viewAll(V.wordsPractice, 2000), goethe()]);
      const types = setlist("Quick lesson types").length ? setlist("Quick lesson types") : ["words", "phrases", "reading", "grammar"];
      const doy = daysBetween(today().slice(0, 4) + "-01-01", today());
      const doneToday = counts.todayRows.filter(r => r.Type === "Quick lesson").length;
      type = typeSel.value || types[(doy + doneToday) % types.length];
      const sits = setlist("Phrase situations");
      const recent = counts.act.filter(r => r.Type === "Quick lesson").map(r => r.Activity);
      const situation = sits.length ? sits[(doy + doneToday) % sits.length] : "everyday life";
      const pos = position();
      const idx = pos ? pos.lektion.Index : 47;
      const startedKeys = new Set(startedRows.map(r => r.Key));
      cands = shuffle(G.filter(w => !startedKeys.has(w.key) && (idx < 24 ? w.level === "A1" : true))).slice(0, 80);
      const nW = setn("Quick lesson words", 6), nE = setn("Quick lesson exercises", 6);
      const studied = S.lektionen.filter(r => r.Index <= idx).map(r => r.Grammar).slice(-6).join("; ");
      lesson = await ask(`${LEARNER}
Make a ${setn("Quick lesson length", 12)}-minute quick lesson of type "${type}" for a phone on the bus. Level ${levelOf(idx)}. Grammar met so far (most recent last): ${studied}. Stay within it.
Types: words = a small themed set (work, home, health, shopping, travel, free time, weather, offices); phrases = ready-made phrases for the situation "${situation}"; reading = a 6-8 sentence everyday text then questions; grammar = one small point from the Lektionen already studied (recent first).
Avoid these recent topics: ${recent.slice(0, 12).join("; ") || "none"}.
Teach ${nW} new words or phrases. For words, choose ONLY from these Goethe-list words the learner hasn't started (German with article, plural): ${cands.map(w => `${w.de}${w.plural ? " (" + w.plural + ")" : ""}`).join(", ")}.
Then ${nE} short exercises using them: the instruction in simple German at this level (e.g. "Ergänze:", "Übersetze ins Deutsche:", "Bilde einen Satz:") plus the material, and "q_en" with the whole exercise in English; never put the answer in the question or in q_en.
Reply with only JSON: {"title":"short English topic","intro":"2-4 sentences of explanation in English (markdown allowed)","text":"German text for type reading, else empty","words":[{"de":"German with article","plural":"","en":"","example":"German sentence","example_en":""}],"exercises":[{"q":"German instruction + material","q_en":"English translation","answer":"...","accepted":["..."],"rule":"one-line reminder without the answer","category":"..."}]}`);
    } catch (e) { host.replaceChildren(e && e.code === "no_sample" || (e && /rate|grant/.test(e.code || "")) ? h("div", { class: "banner bad" }, sampleErr(e)) : errBox(e, run)); return; }

    const st = { day: today(), t0, type, lesson, phase: "teach", q: {}, done: {} };
    store.save(st, true);
    return continueRun(st);
  }

  async function continueRun(st) {
    const { lesson, type, t0 } = st;
    if (st.phase === "teach") {
    await new Promise(res => {
      host.replaceChildren(h("span", { class: "label" }, `Quick lesson · ${type}`), h("h2", null, lesson.title || "Quick lesson"),
        h("div", { class: "prose", html: md(lesson.intro || "") }),
        lesson.text ? h("div", { class: "prose", lang: "de", style: "background:var(--bg);padding:14px;border-radius:8px" }, lesson.text.split(/\n+/).map(p => h("p", null, p)), speakBtn(lesson.text)) : null,
        h("div", { class: "words" }, (lesson.words || []).map(w => h("div", { class: "word" },
          h("div", { class: "row", style: "justify-content:space-between;flex-wrap:nowrap" }, h("span", { class: "de", lang: "de" }, w.de), speakBtn(w.de + ". " + (w.example || ""))),
          w.plural ? h("span", { class: "small muted" }, "Plural: ", w.plural) : null, h("span", null, w.en), w.example ? h("span", { class: "ex", lang: "de" }, w.example) : null, w.example_en ? h("span", { class: "small muted" }, w.example_en) : null))),
        h("div", { class: "row" }, h("button", { class: "btn go", onclick: res }, "Practise")));
    });
      st.phase = "questions"; store.save(st, true);
    }
    if (st.phase === "questions") {
      await runQuestions(host, lesson.exercises || [], "Quick lesson", st.q, () => store.save(st));
      st.phase = "save"; store.save(st, true);
    }
    const qRes = { right: st.q.right || 0, newMistakes: st.q.newMistakes || [] };
    host.replaceChildren(h("h2", null, `${qRes.right} of ${(lesson.exercises || []).length} right`), h("div", { class: "stack small" }, spinner("Saving to Notion…")));
    const log = host.lastChild;
    const once = async (name, fn) => { if (st.done[name]) return st.done[name]; const v = await fn(); st.done[name] = v || true; store.save(st, true); return st.done[name]; };
    try {
      const words = (lesson.words || []).map(w => ({ de: w.de, en: w.en, plural: w.plural, ex: w.example, exen: w.example_en, art: (w.de.match(/^(der|die|das)\s/) || [])[1] || "" }));
      const pos = position();
      const r = await once("words", () => saveWords(words, null, "Quick lesson"));
      await once("mistakes", () => createRows(DS.mistakes, qRes.newMistakes.map(m => mistakeRow(m, "quick lesson", pos && pos.lektion.url))));
      await once("activity", () => createRows(DS.activity, [{ properties: Object.assign({ Activity: lesson.title || "Quick lesson", Type: "Quick lesson", "Quick type": type, Minutes: Math.max(1, Math.round((Date.now() - t0) / 60000)), Correct: qRes.right, Total: (lesson.exercises || []).length, "New cards": r.started + r.created, "Questions asked": (lesson.exercises || []).map(q => plain(q.q)).join("; ").slice(0, 1900) }, dateProp("Date", today())) }]));
      store.clear();
      log.replaceChildren(h("div", { class: "banner good" }, `Learned: ${lesson.title}. ${r.started + r.created} words come back as flashcards tomorrow.`),
        h("div", { class: "row", style: "margin-top:12px" }, h("button", { class: "btn go", onclick: () => run() }, "Another one"), h("a", { class: "btn", href: "#home", "data-go": "home" }, "Back to today")));
    } catch (e) { log.replaceChildren(errBox(e, () => continueRun(st))); }
  }
}

route();
capMcp.then(m => { if (!m) view.prepend(h("div", { class: "banner bad", style: "margin-top:14px" }, errText({ code: "no_mcp" }))); });
