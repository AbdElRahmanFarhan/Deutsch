<style>
/* Layout: one column of panels under a sticky tab bar; progress drawn as a tram line of 48 stops. */
:root {
  --bg: #f6f5f3;
  --panel: #ffffff;
  --ink: #1d1b1c;
  --muted: #6b6466;
  --line: #e3dfdd;
  --red: #c8102e;          /* accent */
  --red-soft: #fbe9ec;
  --good: #1f7a4d;
  --good-soft: #e5f3ec;
  --warn: #9a5b00;
  --warn-soft: #fbf0dc;
  --der: #1f5fbf;          /* article colours */
  --die: #c8102e;
  --das: #1f7a4d;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161415; --panel: #211e1f; --ink: #f1eeee; --muted: #a49c9e; --line: #36302f;
  --red: #ff5a6e; --red-soft: #3a1d22; --good: #5fcf96; --good-soft: #17322a; --warn: #f0b45a; --warn-soft: #3a2c16; --der: #7fb0ff; --die: #ff6b80; --das: #6fdca6;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161415; --panel: #211e1f; --ink: #f1eeee; --muted: #a49c9e; --line: #36302f;
  --red: #ff5a6e; --red-soft: #3a1d22; --good: #5fcf96; --good-soft: #17322a; --warn: #f0b45a; --warn-soft: #3a2c16; --der: #7fb0ff; --die: #ff6b80; --das: #6fdca6;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 10px 0; display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font: 800 26px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.brand h1 span { color: var(--red); }
.brand .when { font: 13px var(--mono); color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; color: var(--muted); font: 600 14px var(--body); padding: 8px 12px 10px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }
nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
main .wrap { display: flex; flex-direction: column; gap: 16px; padding-block: 16px 48px; }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h2 { font: 800 20px/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0; text-wrap: balance; }
h3 { font: 600 15px/1.3 var(--body); margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font: 800 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--body); padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--ink); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.red { background: var(--red-soft); color: var(--red); }
button.btn { font: 600 14px var(--body); border-radius: 8px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
button.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
button.btn:disabled { opacity: .5; cursor: default; }
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.item:first-child { border-top: 0; }
.item .main { min-width: 0; flex: 1 1 220px; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); font-size: 14px; }
.note.info { background: var(--line); }
.saying { border-left: 3px solid var(--red); padding: 2px 0 2px 12px; }
.saying .de { font-style: italic; font-size: 16px; }
/* Tram line */
.tram { overflow-x: auto; padding-bottom: 4px; }
.tram svg { display: block; min-width: 640px; width: 100%; height: auto; }
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--red); }
.weeks { display: flex; gap: 6px; align-items: flex-end; height: 90px; }
.weeks div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; height: 100%; min-width: 0; }
.weeks i { width: 100%; max-width: 36px; background: var(--red); border-radius: 3px 3px 0 0; }
.weeks i.plan { background: var(--line); }
.weeks small { font: 11px var(--mono); color: var(--muted); }
/* Practice */
.q { font-size: 18px; }
.q .de { font-weight: 600; }
input[type=text], input[type=number], input[type=time], input[type=date], select, textarea { font: 15px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
textarea { min-height: 120px; resize: vertical; }
.feedback { border-radius: 8px; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.feedback.ok { background: var(--good-soft); }
.feedback.bad { background: var(--red-soft); }
.prose { max-width: 65ch; }
.prose p { margin: 0 0 8px; }
.prose ul { margin: 0 0 8px; padding-left: 20px; }
.vocab { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.vocab div { border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
.steps { display: flex; gap: 4px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--red); }
pre.prompt { white-space: pre-wrap; font: 13px/1.45 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 260px; overflow: auto; margin: 0; }
/* Settings */
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-weight: 600; font-size: 13px; }
.field .help { font-size: 12px; color: var(--muted); }
.toggle { display: flex; align-items: center; gap: 8px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--red); }
.table { overflow-x: auto; }
.table table { border-collapse: collapse; width: 100%; min-width: 520px; }
.table th, .table td { text-align: left; padding: 6px; border-top: 1px solid var(--line); font-size: 14px; }
.table th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-top: 0; }
details summary { cursor: pointer; font-weight: 600; }
/* Flashcards and gender colours */
.art { font-weight: 600; }
.art-der { color: var(--der); } .art-die { color: var(--die); } .art-das { color: var(--das); }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 24px 16px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; background: var(--bg); min-height: 150px; justify-content: center; }
.card hr { width: 60%; border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.card-de { font-size: 26px; font-weight: 600; }
.card-en { font-size: 22px; }
.hook { background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; margin-top: 6px; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; }
.rate .btn small { font: 11px var(--mono); opacity: .7; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .4s ease; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Deutsch <span>A2</span></h1><span class="when mono" id="when"></span></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="today" aria-selected="true">Today</button>

<script>
"use strict";
/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const DAY_NAMES = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday", sun: "Sunday" };
const TZ = "Europe/Berlin";
function berlinNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  return { iso: `${p.year}-${p.month}-${p.day}`, min: Number(p.hour) * 60 + Number(p.minute) };
}
const toDate = (iso) => new Date(iso + "T00:00:00Z");
const isoOf = (d) => d.toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = toDate(iso); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
const dayKey = (iso) => DAYS[(toDate(iso).getUTCDay() + 6) % 7];
const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const toMin = (hhmm) => { if (!hhmm) return null; const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const fmtDate = (iso, opts = { weekday: "short", day: "numeric", month: "short" }) => toDate(iso).toLocaleDateString("en-GB", { ...opts, timeZone: "UTC" });
const fmtHours = (min) => (min / 60).toFixed(min % 60 ? 1 : 0) + " h";
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }
function mdLite(src) {
  const blocks = String(src || "").trim().split(/\n{2,}/);
  return blocks.map((b) => {
    const lines = b.split("\n");
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/`(.+?)`/g, "<code>$1</code>");
    if (lines.every((l) => /^\s*[-•]\s/.test(l))) return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-•]\s/, "")) + "</li>").join("") + "</ul>";
    return "<p>" + lines.map(inline).join("<br>") + "</p>";
  }).join("");
}

/* ---------- same seeded random as scripts/common.py ---------- */
function fnv1a(text) { let h = 0x811c9dc5; for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- state ---------- */
const S = { cfg: {}, progress: null, syllabus: [], sayings: [], sessions: {}, refreshers: [], srs: {}, mistakes: [], lessons: {}, reports: [], daily: {}, meta: {}, loaded: false, offline: false };
let db = null, sample = null, tab = "today";
const run = { mode: null }; // active practice run

/* ---------- planner ---------- */
function inDaysOff(iso) {
  return (S.cfg.schedule?.days_off || []).some((e) => { if (e.includes("..")) { const [a, b] = e.split(".."); return a <= iso && iso <= b; } return e === iso; });
}
function sessionsFor(iso) {
  const sc = S.cfg.schedule; if (!sc || iso < sc.start_date || inDaysOff(iso)) return [];
  const k = dayKey(iso); const out = [];
  (sc.session || []).forEach((s) => { if (s.day === k) out.push({ ...s, slot: out.length + 1, id: `${iso}-${out.length + 1}`, date: iso }); });
  return out;
}
function slotsFor(iso) {
  const r = S.cfg.refreshers, rem = S.cfg.reminders || {};
  if (!r || !r.enabled || !(r.days || []).includes(dayKey(iso))) return [];
  const lo = Math.max(toMin(r.window_start), toMin(rem.quiet_end || "00:00"));
  const hi = Math.min(toMin(r.window_end), toMin(rem.quiet_start || "23:59"));
  const len = Number(r.minutes); if (hi - lo < len) return [];
  const blocked = sessionsFor(iso).filter((s) => s.start).map((s) => [toMin(s.start) - 15, toMin(s.start) + Number(s.minutes) + 15]);
  const rnd = mulberry32(fnv1a(iso + "|refresher"));
  const steps = Math.floor((hi - len - lo) / 5) + 1; const picks = [];
  for (let i = 0; i < 300 && picks.length < Number(r.per_day); i++) {
    const m = lo + Math.floor(rnd() * steps) * 5;
    if (blocked.some(([a, b]) => m < b && m + len > a)) continue;
    if (picks.some((p) => Math.abs(m - p) < Number(r.min_gap_minutes))) continue;
    picks.push(m);
  }
  return picks.sort((a, b) => a - b);
}
const isDone = (id) => S.sessions[id]?.status === "done";
const weeklyPlanMinutes = () => (S.cfg.schedule?.session || []).reduce((a, s) => a + Number(s.minutes || 0), 0);
function lektionHours(item) { const p = S.cfg.plan?.pace || {}; return item.level === "A1" ? Number(p.a1_hours_per_lektion || 1.75) : Number(p.a2_hours_per_lektion || 3.5); }

function computePlan() {
  const now = berlinNow(), today = now.iso, sc = S.cfg.schedule, acc = S.cfg.accountability || {};
  const start = sc?.start_date || today;
  // Past sessions: done or missed (today's sessions count as missed only once their end time has passed).
  const missed = []; let doneCount = 0;
  for (let d = start; d <= today; d = addDays(d, 1)) {
    for (const s of sessionsFor(d)) {
      if (isDone(s.id)) { doneCount++; continue; }
      const ended = d < today || (s.start && toMin(s.start) + Number(s.minutes) < now.min);
      if (ended) missed.push(s);
    }
  }
  // Make-up: missed sessions in the last 14 days go to upcoming weekend days, capped per day.
  const makeup = []; let slideMin = 0;
  if (acc.missed_mode === "weekend") {
    const cap = Number(acc.weekend_makeup_cap_minutes ?? 60);
    const used = {};
    for (const s of missed.filter((m) => daysBetween(m.date, today) <= 14 && !S.sessions[m.id]?.waived)) {
      let left = Number(s.minutes);
      for (let d = today, guard = 0; left > 0 && guard < 14; d = addDays(d, 1), guard++) {
        const k = dayKey(d); if (k !== "sat" && k !== "sun") continue;
        if (!sessionsFor(d).length) continue;
        const room = cap - (used[d] || 0); if (room <= 0) continue;
        const take = Math.min(room, left); used[d] = (used[d] || 0) + take; left -= take;
        makeup.push({ date: d, minutes: take, from: s });
      }
      slideMin += left;
    }
  } else if (acc.missed_mode === "shrink") {
    slideMin = missed.filter((m) => daysBetween(m.date, today) <= 14).reduce((a, s) => a + Number(s.minutes), 0);
  }
  // Remaining work.
  const done = new Set(S.progress?.done || []);
  let remainingH = 0;
  for (const it of S.syllabus) if (!done.has(it.index)) remainingH += lektionHours(it);
  const cur = S.syllabus[S.progress?.current_index ?? 0];
  if (cur && !done.has(cur.index) && S.progress?.current_part === 2) remainingH -= lektionHours(cur) / 2;
  const examH = Number(S.cfg.plan?.pace?.exam_prep_hours || 28);
  const examDoneMin = Object.values(S.sessions).filter((x) => x.status === "done" && x.phase === "exam").reduce((a, x) => a + Number(x.minutes || 0), 0);
  remainingH += Math.max(0, examH - examDoneMin / 60);
  // Pace: planned weekly hours, or the real pace of the last 7 days when it falls below the minimum.
  const last7 = Object.values(S.sessions).filter((x) => x.status === "done" && daysBetween(x.date, today) < 7 && x.date <= today);
  const last7Min = last7.reduce((a, x) => a + Number(x.minutes || 0), 0);
  const planWeekH = weeklyPlanMinutes() / 60 || 1;
  const started = today >= start;
  const behindPace = started && daysBetween(start, today) >= 7 && last7.length < Number(acc.min_sessions_per_7_days ?? 5);
  const paceH = behindPace ? Math.max(2, last7Min / 60) : planWeekH;
  const offDays = (sc?.days_off || []).reduce((a, e) => { if (!e.includes("..")) return a + (e >= today ? 1 : 0); const [x, y] = e.split(".."); return y < today ? a : a + daysBetween(x > today ? x : today, y) + 1; }, 0);
  const daysNeeded = Math.ceil((remainingH / paceH) * 7 + offDays + slideMin / 60 / planWeekH * 7);
  const from = started ? today : start;
  const projected = addDays(from, daysNeeded);
  const target = S.cfg.plan?.goal?.target_date || "";
  // Streak.
  const counts = acc.streak_counts || "either";
  const activeDay = (d) => {
    const f = Object.values(S.sessions).some((x) => x.date === d && x.status === "done");
    const r = S.refreshers.some((x) => x.date === d);
    return counts === "focus_session" ? f : counts === "refresher" ? r : f || r;
  };
  let streak = 0; let d = activeDay(today) ? today : addDays(today, -1);
  for (let g = 0; g < 400; g++, d = addDays(d, -1)) {
    if (d < start) break;
    if (inDaysOff(d) && !activeDay(d)) continue;
    if (!activeDay(d)) break; streak++;
  }
  // Study time this week (Mon-Sun).
  const monday = addDays(today, -((toDate(today).getUTCDay() + 6) % 7));
  const weekMin = Object.values(S.sessions).filter((x) => x.status === "done" && x.date >= monday && x.date <= today).reduce((a, x) => a + Number(x.minutes || 0), 0)
    + S.refreshers.filter((x) => x.date >= monday && x.date <= today).reduce((a, x) => a + Number(x.minutes || 0), 0);
  // Missed in a row (for comeback sessions).
  let missedInRow = 0;
  for (let i = missed.length - 1; i >= 0; i--) { const s = missed[i]; const later = Object.values(S.sessions).some((x) => x.status === "done" && x.date > s.date); if (later) break; missedInRow++; }
  return { today, now, missed, recentMissed: missed.filter((m) => daysBetween(m.date, today) <= 7), makeup, slideMin, remainingH, projected, target, behindPace, last7Count: last7.length, streak, weekMin, monday, doneCount, missedInRow, started, start };
}
function phaseOf(index) { const it = S.syllabus[index]; return it ? it.level : "exam"; }

/* ---------- words and SRS ---------- */
// Words have two schedules: rec (German -> English) and prod (English -> German with article
// and plural, opened after `produce_after_correct` correct recognitions). Mistakes and grammar
// items keep one schedule in their top-level fields.
const rvCfg = () => S.cfg.review || {};
function newSched(due) { return { ef: Number(rvCfg().starting_ease ?? 2.5), reps: 0, interval: 0, lapses: 0, due, last: null, correct: 0 }; }
function sm2Step(sched, quality) {
  const rv = rvCfg(); const today = berlinNow().iso;
  let ef = Number(sched.ef ?? rv.starting_ease ?? 2.5), reps = Number(sched.reps || 0), interval = Number(sched.interval || 0), lapses = Number(sched.lapses || 0), correct = Number(sched.correct || 0);
  if (quality >= 3) {
    interval = reps === 0 ? Number(rv.first_interval_days ?? 1) : reps === 1 ? Number(rv.second_interval_days ?? 6) : Math.round(interval * ef);
    reps += 1; correct += 1;
  } else { reps = 0; interval = 1; lapses += 1; }
  ef = Math.max(Number(rv.minimum_ease ?? 1.3), ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  if (lapses >= Number(rv.leech_after_failures ?? 4)) interval = Math.min(interval, Number(rv.max_hard_interval_days ?? 4));
  return { ef: Math.round(ef * 100) / 100, reps, interval, lapses, correct, due: addDays(today, interval), last: today };
}

async function put(path, data) {

  try { await db.doc(path).set(data); }
  catch (e) { if (e?.code === "unavailable") { await new Promise((r) => setTimeout(r, 600 + Math.random() * 600)); await db.doc(path).set(data); } else { toast(e?.code === "quota_exceeded" ? "Storage is full. Delete old items first." : "Couldn't save. Try again."); throw e; } }
}
// Card ratings are saved one after another in the background, so the next card shows at once.
let writeChain = Promise.resolve();
function queueWrite(path, data) { writeChain = writeChain.then(() => put(path, data)).catch(() => {}); return writeChain; }
async function saveMistake(m, source, q) {

// Questions asked recently, so new ones never repeat them word for word.
function recentAsked() {

function shapeHint(answer) {

}
async function ruleHint(question, answer) {

function adaptiveLevel() {

/* ---------- answer checking ---------- */
function norm(s) {
  return String(s || "").trim().replace(/[.!?;,]+$/g, "").replace(/\s+/g, " ").toLowerCase()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[„“"']/g, "");
}
async function grade(question, answer, accepted, given) {
  const opts = [answer, ...(accepted || [])].filter(Boolean);
  if (opts.some((o) => norm(o) === norm(given))) {
    const exact = opts.some((o) => o.trim().replace(/[.!?]+$/, "") === given.trim().replace(/[.!?]+$/, ""));
    return { correct: true, corrected: answer, reason: exact ? "" : "Right. Check capital letters and umlauts (ä ö ü ß) against the answer." };
  }
  if (!sample) return { correct: false, corrected: answer, reason: "" , local: true };
  try {
    const tutor = S.cfg.tutor || {};
    const r = await sample.json(
      `You are a German tutor for an A1-A2 learner. Judge the learner's answer. Explain in English only, in one short line.\n` +
      `Question: ${question}\nExpected answer: ${answer}\nAlso accepted: ${(accepted || []).join(" | ") || "none"}\nLearner's answer: ${given}\n` +
      `Accept answers that are correct German and fit the question, even if worded differently. Small spelling slips in otherwise correct German count as correct but mention them.\n` +
      `Reply with only JSON: {"correct": true|false, "corrected": "the correct German", "reason": "one line in English (empty if fully right)", "category": "grammar|vocabulary|spelling|word order|article|case"}` + (tutor.correction_style === "detailed" ? "\nThe reason may be up to two lines." : ""),
      { modelTier: "quick" });
    return { correct: !!r.correct, corrected: String(r.corrected || answer), reason: String(r.reason || ""), category: String(r.category || "grammar") };
  } catch (e) {
    return { correct: false, corrected: answer, reason: "", local: true };
  }
}

function parseReport(text) {
  const body = (text.split("=== DEUTSCH REPORT ===")[1] || text).split("=== END ===")[0];
  const out = { session: "", minutes: 0, mistakes: [], new_words: [], notes: "" }; let section = "";
  for (const raw of body.split("\n")) {
    const line = raw.trim(); if (!line) continue;
    let m;
    if ((m = line.match(/^session:\s*(.*)$/i))) { out.session = m[1].trim(); section = ""; continue; }
    if ((m = line.match(/^minutes:\s*(\d+)/i))) { out.minutes = Number(m[1]); section = ""; continue; }
    if (/^mistakes:/i.test(line)) { section = "mistakes"; continue; }
    if (/^new_words:/i.test(line)) { section = "words"; continue; }
    if ((m = line.match(/^notes:\s*(.*)$/i))) { out.notes = m[1]; section = ""; continue; }
    if (line.startsWith("-") && section) {
      const f = Object.fromEntries(line.slice(1).split("|").map((p) => { const i = p.indexOf(":"); return [p.slice(0, i).trim().toLowerCase(), p.slice(i + 1).trim()]; }).filter(([k]) => k));
      if (section === "mistakes" && f.right) out.mistakes.push({ wrong: f.wrong || "", right: f.right, reason: f.reason || "", category: (f.category || "grammar").toLowerCase() });
      if (section === "words" && f.de) out.new_words.push({ de: f.de, en: f.en || "" });
    }
  }
  return out;
}
function previewReport(text, reportId) {
  const r = parseReport(text); const box = $("#report-preview");
  if (!r.mistakes.length && !r.new_words.length && !r.minutes) { box.innerHTML = `<div class="note">That doesn't look like a report. It should start with "=== DEUTSCH REPORT ===".</div>`; return; }
  const knownSession = /^\d{4}-\d{2}-\d{2}-\d+$/.test(r.session);
  box.innerHTML = `<div class="list">
    <div class="item"><div class="main"><h3>${r.minutes} minutes${knownSession ? ` · marks session ${esc(r.session)} done` : " · counted as extra speaking practice"}</h3><div class="muted small">${esc(r.notes)}</div></div></div>
    ${r.mistakes.map((m) => `<div class="item"><div class="main"><h3>${esc(m.wrong)} → ${esc(m.right)}</h3><div class="muted small">${esc(m.reason)} · ${esc(m.category)}</div></div></div>`).join("")}
    ${r.new_words.length ? `<div class="item"><div class="main"><h3>New words</h3><div class="small">${r.new_words.map((w) => `${esc(w.de)} (${esc(w.en)})`).join(", ")}</div></div></div>` : ""}
  </div><div class="row"><button class="btn primary" id="apply-report">Apply</button></div>`;
  $("#apply-report").onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      const today = berlinNow().iso;
      for (const m of r.mistakes) await saveMistake(m, "claude-app");
      await addWords(r.new_words, S.progress?.current_index ?? null);
      const sid = knownSession ? r.session : `${today}-speak-${Date.now().toString(36)}`;
      const prev = S.sessions[sid];
      if (!prev || prev.status !== "done") await put(`sessions/${sid}`, { id: sid, date: knownSession ? r.session.slice(0, 10) : today, kind: "speaking", status: knownSession ? "done" : "extra", minutes: r.minutes, source: "claude-app", notes: r.notes, phase: phaseOf(S.progress?.current_index ?? 0) });
      const rid = reportId || `${today}-${Date.now().toString(36)}`;
      await put(`reports/${rid}`, { id: rid, created: new Date().toISOString(), text, processed: true });
      toast("Report applied."); $("#report-text") && ($("#report-text").value = ""); render();
    } catch { e.currentTarget.disabled = false; }
  };
}

function pickRefresherItems(n) {
  const r = S.cfg.refreshers || {}; const mix = r.mix || {}; const today = berlinNow().iso;

  const pastEx = Object.entries(S.lessons).filter(([, L]) => L.lektion_index != null && (done.has(L.lektion_index) || L.lektion_index < curI || (L.lektion_index === curI && L.part === 1 && S.progress?.current_part === 2)))

    past_lessons: pastEx,

(async function boot() {
  render();
  const timer = setTimeout(() => { if (!S.loaded) { S.loaded = true; $("#view").innerHTML = `<section class="panel"><h2>Can't reach your course data yet</h2><p class="muted">Check your connection. The page keeps trying and fills in when the data arrives.</p></section>`; } }, 10000);
  const [d, smp] = await Promise.all([claude.use("db"), claude.use("sample")]);
  db = d; sample = smp;
  if (!db) { clearTimeout(timer); S.loaded = true; $("#view").innerHTML = `<section class="panel"><h2>Sign in to see your course</h2><p class="muted">Your plan and progress are stored with your Claude account. Open this page in Claude while signed in.</p></section>`; return; }
  let pending = new Set(["config", "meta", "progress", "sessions", "refreshers", "srs", "mistakes", "lessons", "reports", "daily"]);
  const ready = (name, snap) => { if (!snap.metadata.fromCache) pending.delete(name); if (pending.size === 0 || !snap.metadata.fromCache) { clearTimeout(timer); S.loaded = true; } if (!run.mode || tab !== "practice") render(); };
  const onErr = () => {};
  db.collection("config").onSnapshot((q) => { S.cfg = {}; q.docs.forEach((x) => (S.cfg[x.id] = x.data())); ready("config", q); }, onErr);
  db.collection("meta").onSnapshot((q) => { S.meta = {}; q.docs.forEach((x) => (S.meta[x.id] = x.data())); S.syllabus = S.meta.syllabus?.items || []; S.sayings = S.meta.sayings?.items || []; ready("meta", q); }, onErr);
  db.doc("progress/main").onSnapshot((x) => { S.progress = x.exists ? x.data() : { current_index: 0, current_part: 1, done: [] }; ready("progress", x); }, onErr);
  db.collection("sessions").onSnapshot((q) => { S.sessions = {}; q.docs.forEach((x) => (S.sessions[x.id] = x.data())); ready("sessions", q); }, onErr);
  db.collection("refreshers").onSnapshot((q) => { S.refreshers = q.docs.map((x) => x.data()); ready("refreshers", q); }, onErr);
  db.collection("srs").onSnapshot((q) => { S.srs = {}; q.docs.forEach((x) => (S.srs[x.id] = x.data())); ready("srs", q); }, onErr);
  db.collection("mistakes").onSnapshot((q) => { S.mistakes = q.docs.map((x) => x.data()); ready("mistakes", q); }, onErr);
  db.collection("lessons").onSnapshot((q) => { S.lessons = {}; q.docs.forEach((x) => (S.lessons[x.id] = x.data())); ready("lessons", q); }, onErr);
  db.collection("reports").onSnapshot((q) => { S.reports = q.docs.map((x) => x.data()); ready("reports", q); }, onErr);
  db.collection("daily").where("date", ">=", addDays(berlinNow().iso, -14)).onSnapshot((q) => { q.docs.forEach((x) => (S.daily[x.id] = x.data())); ready("daily", q); }, onErr);
})();
</script>
